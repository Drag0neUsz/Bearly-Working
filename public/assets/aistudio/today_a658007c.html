<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Bearly Finished - Gamified Habit &amp; Task Companion</title>
<!-- Google Fonts: Nunito & Nunito Sans for Duolingo Playful Vibe -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            nunito: ['"Nunito"', 'sans-serif'],
          },
          colors: {
            duoGreen: '#58cc02',
            duoGreenDark: '#46a302',
            duoBlue: '#1cb0f6',
            duoBlueDark: '#1899d6',
            duoOrange: '#ff9600',
            duoOrangeDark: '#e08400',
            duoYellow: '#ffc800',
            duoYellowDark: '#dca800',
            duoRed: '#ff4b4b',
            duoGray: '#e5e5e5',
            duoGrayDark: '#cfcfcf',
            duoText: '#4b4b4b',
            duoBg: '#f7f7f7',
          },
          boxShadow: {
            'duo-green': '0 4px 0 #46a302',
            'duo-blue': '0 4px 0 #1899d6',
            'duo-orange': '0 4px 0 #e08400',
            'duo-gray': '0 4px 0 #d0d0d0',
            'duo-card': '0 3px 0 #e5e5e5',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-duolingo-styling">
    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    /* Tactile 3D button press animation */
    .duo-btn-green:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #46a302;
    }
    .duo-btn-blue:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1899d6;
    }
    .duo-tab-active {
      box-shadow: inset 0 -3px 0 #58cc02;
    }
    
    /* Speech Bubble Tail */
    .speech-tail {
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 12px solid #ffffff;
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      filter: drop-shadow(0 2px 0 #e5e7eb);
    }
  </style>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen p-0 sm:p-4 text-slate-800 font-nunito antialiased">
<!-- BEGIN: MobileAppFrame -->
<div class="w-full max-w-[390px] h-[844px] bg-white sm:rounded-[44px] shadow-2xl flex flex-col overflow-hidden border-0 sm:border-[8px] sm:border-slate-800 relative">
<!-- BEGIN: iOSStatusBar -->
<header class="pt-3 px-6 pb-2 flex justify-between items-center text-xs font-black tracking-tight z-20 shrink-0">
<span class="font-extrabold text-sm">9:41</span>
<div class="w-20 h-4 bg-slate-900 rounded-full mx-auto -mt-1 hidden sm:block"></div>
<div class="flex items-center space-x-2 text-slate-700">
<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"></path></svg>
<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"></path></svg>
<div class="w-5 h-2.5 border-2 border-slate-700 rounded-sm p-0.5 flex items-center">
<div class="w-full h-full bg-slate-700 rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: GamifiedTopStatsBar -->
<div class="px-5 py-2.5 border-b-2 border-slate-100 flex items-center justify-between shrink-0 bg-white" data-purpose="streak-and-currency-stats">
<!-- Streak Badge -->
<div class="flex items-center space-x-1.5 bg-orange-50 border-2 border-b-4 border-orange-200 px-3 py-1 rounded-full cursor-pointer hover:scale-105 transition-transform"><span class="text-sm text-duoOrangeDark font-black leading-none inline-flex items-center justify-center">☒</span><span class="text-duoOrangeDark font-black text-sm tracking-wide">5</span></div>
<!-- Honey / Gem Currency Badge -->

<!-- Calendar Connected Status Pill -->
<div class="flex items-center space-x-1.5 bg-green-50 border-2 border-b-4 border-green-200 px-2.5 py-1 rounded-full"><span class="w-2 h-2 rounded-full bg-duoGreen animate-pulse"></span><span class="text-[11px] font-extrabold text-duoGreenDark uppercase tracking-wider">Sync Active</span></div>
</div>
<!-- END: GamifiedTopStatsBar -->
<!-- Scrollable Main Content -->
<main class="flex-1 overflow-y-auto px-5 pt-3 pb-24 space-y-4" data-purpose="dashboard-scrollable-content">
<!-- BEGIN: MascotSection -->
<section class="flex flex-col items-center pt-1" data-purpose="mascot-and-speech-bubble">
<!-- Speech Bubble (Duolingo Style) -->
<div class="relative w-full max-w-[320px] bg-white border-2 border-slate-200 rounded-2xl p-3.5 shadow-sm text-center mb-4 transition-transform hover:-translate-y-0.5">
<!-- Spicy Roast Tag Badge -->
<div class="inline-flex items-center space-x-1 bg-red-100 border-2 border-b-4 border-red-200 text-duoRed font-black text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full mb-1.5"><span class="text-xs text-duoRed font-black leading-none inline-flex items-center justify-center">☒</span><span class="">Bear [Spicy Roast]</span></div>
<!-- Roast Text -->
<p class="text-slate-800 font-extrabold text-sm sm:text-base leading-snug">
            “Why are you poking me? Go finish a task!”
          </p>
<!-- Speech Tail Pointer -->
<div class="speech-tail"></div>
</div>
<!-- Duo Style Cartoon Bear Mascot -->
<div class="relative w-28 h-28 flex items-center justify-center cursor-pointer transition-transform hover:scale-105 active:scale-95">
<!-- Bear SVG Illustration -->
<svg class="w-full h-full drop-shadow-md" fill="none" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
<!-- Left Ear Outer -->
<circle cx="28" cy="30" fill="#8B4513" r="18" stroke="#5C2D0C" stroke-width="4"></circle>
<!-- Left Ear Inner -->
<circle cx="28" cy="30" fill="#F4A460" r="10"></circle>
<!-- Right Ear Outer -->
<circle cx="92" cy="30" fill="#8B4513" r="18" stroke="#5C2D0C" stroke-width="4"></circle>
<!-- Right Ear Inner -->
<circle cx="92" cy="30" fill="#F4A460" r="10"></circle>
<!-- Bear Head -->
<circle cx="60" cy="64" fill="#A0522D" r="44" stroke="#5C2D0C" stroke-width="5"></circle>
<!-- Cheeks -->
<circle cx="34" cy="74" fill="#F87171" opacity="0.6" r="8"></circle>
<circle cx="86" cy="74" fill="#F87171" opacity="0.6" r="8"></circle>
<!-- Angry / Sassy Eyebrows -->
<path d="M34 50 L48 55" stroke="#451A03" stroke-linecap="round" stroke-width="4.5"></path>
<path d="M86 50 L72 55" stroke="#451A03" stroke-linecap="round" stroke-width="4.5"></path>
<!-- Eyes (Slightly squinted expressive) -->
<ellipse cx="42" cy="60" fill="#201007" rx="4.5" ry="5.5"></ellipse>
<circle cx="43.5" cy="58" fill="#FFFFFF" r="1.8"></circle>
<ellipse cx="78" cy="60" fill="#201007" rx="4.5" ry="5.5"></ellipse>
<circle cx="79.5" cy="58" fill="#FFFFFF" r="1.8"></circle>
<!-- Snout -->
<ellipse cx="60" cy="75" fill="#F5DEB3" rx="19" ry="14" stroke="#5C2D0C" stroke-width="3"></ellipse>
<!-- Nose -->
<polygon fill="#2B1408" points="60,70 54,65 66,65"></polygon>
<ellipse cx="60" cy="66" fill="#2B1408" rx="6" ry="4"></ellipse>
<!-- Cute Sassy Open Mouth -->
<path d="M54 75 Q60 83 66 75 Z" fill="#991B1B" stroke="#5C2D0C" stroke-width="2"></path>
<path d="M57 79 Q60 81 63 79" stroke="#FCA5A5" stroke-linecap="round" stroke-width="1.5"></path>
</svg>
</div>
</section>
<!-- END: MascotSection -->
<!-- BEGIN: ScorecardSection -->
<section class="bg-white rounded-3xl border-2 border-slate-200 p-4 shadow-sm" data-purpose="daily-scorecard">
<div class="flex items-center justify-between mb-2">
<div class="flex items-center space-x-1.5">
<span class="text-sm font-black text-slate-800 tracking-wide uppercase">Daily Scorecard</span>
</div>
<span class="text-xs font-black px-2.5 py-0.5 rounded-full bg-slate-100 border-2 border-b-4 border-slate-200 text-slate-600">0 / 0 Completed</span>
</div>
<!-- Chunky Duolingo Progress Bar -->
<div class="relative flex items-center gap-2 mt-1">
<div class="h-4 flex-1 bg-slate-100 rounded-full border-2 border-slate-200 overflow-hidden relative p-0.5">
<!-- Progress Fill (Currently 15% preview fill with glossy reflection) -->
<div class="h-full bg-duoGreen rounded-full w-[12%] relative">
<div class="absolute inset-x-0 top-0 h-1/2 bg-white/30 rounded-t-full"></div>
</div>
</div>
<!-- Milestone Reward Icon -->
<div class="w-8 h-8 rounded-full bg-amber-100 border-2 border-amber-300 flex items-center justify-center shrink-0 -mr-1"><span class="text-sm text-amber-500 font-black leading-none inline-flex items-center justify-center">☒</span></div>
</div>
<p class="text-xs text-slate-400 font-extrabold mt-2 text-center flex items-center justify-center gap-1">
<span class="text-xs text-slate-400 font-black leading-none inline-flex items-center justify-center">☒</span> No tasks scheduled. The bear is watching!
        </p>
</section>
<!-- END: ScorecardSection -->
<!-- BEGIN: SegmentedTabs -->
<nav class="bg-slate-100 p-1.5 rounded-2xl flex items-center gap-1 border-2 border-slate-200/80" data-purpose="task-filter-navigation"><button class="flex-1 py-2 rounded-xl text-xs font-black bg-white text-duoGreenDark border-2 border-b-4 border-slate-200 shadow-sm text-center transition-all">All (0)</button><button class="flex-1 py-2 rounded-xl text-xs font-black text-slate-500 hover:text-slate-800 border-2 border-b-4 border-transparent text-center transition-colors">Pending (0)</button><button class="flex-1 py-2 rounded-xl text-xs font-black text-slate-500 hover:text-slate-800 border-2 border-b-4 border-transparent text-center transition-colors">Done (0)</button></nav>
<!-- END: SegmentedTabs -->
<!-- BEGIN: EmptyStateCard -->
<section class="bg-white rounded-3xl border-2 border-slate-200 p-6 flex flex-col items-center text-center shadow-duo-card relative overflow-hidden" data-purpose="empty-state-commitment">
<!-- Playful Background Accents -->
<div class="w-16 h-16 rounded-full bg-green-50 border-2 border-green-100 flex items-center justify-center mb-3">
<!-- Calendar 3D Icon Graphic -->
<svg class="w-8 h-8 text-duoGreen" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
<rect height="18" rx="4" ry="4" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
<circle cx="12" cy="15" fill="currentColor" r="1.5"></circle>
</svg>
</div>
<h3 class="text-base font-black text-slate-800 uppercase tracking-wide">
          No schedule items today
        </h3>
<p class="text-xs font-bold text-slate-400 mt-1 max-w-[210px] leading-relaxed">
          Tap below to lock in commitments before the bear gets grumpy.
        </p>
<!-- 3D Chunky Duo Button -->
<button class="mt-5 w-full duo-btn-green bg-duoGreen hover:bg-[#52be02] text-white font-black text-sm uppercase tracking-wider py-3.5 px-6 rounded-2xl shadow-duo-green transition-all flex items-center justify-center space-x-2">
<span class="text-lg leading-none">+</span>
<span class="">Add Commitment</span>
</button>
</section>
<!-- END: EmptyStateCard -->
</main>
<!-- BEGIN: FloatingActionButton -->
<button aria-label="Quick Add Task" class="absolute bottom-20 right-5 w-14 h-14 bg-duoBlue hover:bg-[#19a5e8] text-white rounded-2xl shadow-duo-blue duo-btn-blue flex items-center justify-center z-30 transition-all group">
<svg class="w-7 h-7 stroke-[3.5] stroke-current transform group-hover:rotate-90 transition-transform duration-200" fill="none" viewBox="0 0 24 24">
<line stroke-linecap="round" x1="12" x2="12" y1="5" y2="19"></line>
<line stroke-linecap="round" x1="5" x2="19" y1="12" y2="12"></line>
</svg>
</button>
<!-- END: FloatingActionButton -->
<!-- BEGIN: DuoBottomNavBar -->
<nav class="absolute bottom-0 inset-x-0 bg-white border-t-2 border-slate-200 px-3 py-2 flex justify-around items-center z-20" data-purpose="mobile-bottom-navigation"><!-- Tab 1: Today (Active Duolingo highlighted tab) -->
<button class="flex flex-col items-center justify-center text-duoGreen w-16 py-1 transition-all relative">
<div class="w-8 h-8 rounded-2xl bg-green-50 border-2 border-duoGreen flex items-center justify-center text-duoGreen shadow-[0_2px_0_#46a302]"><svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
<span class="text-[11px] font-black uppercase tracking-wider mt-1 text-duoGreen">Today</span>
</button>
<!-- Tab 2: Calendar -->
<button class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 w-16 py-1 transition-colors group">
<div class="w-7 h-7 flex items-center justify-center"><svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"></path></svg></div>
<span class="text-[11px] font-black uppercase tracking-wider mt-1">Calendar</span>
</button>
<!-- Tab 3: Roasts -->
<button class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 w-16 py-1 transition-colors group">
<div class="w-7 h-7 flex items-center justify-center">
<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
<path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"></path>
</svg>
</div>
<span class="text-[11px] font-black uppercase tracking-wider mt-1">Roasts</span>
</button>
<!-- Tab 4: Settings -->
<button class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 w-16 py-1 transition-colors group">
<div class="w-7 h-7 flex items-center justify-center">
<svg class="w-6 h-6 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="3"></circle>
<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
</svg>
</div>
<span class="text-[11px] font-black uppercase tracking-wider mt-1">Settings</span>
</button></nav>
<!-- END: DuoBottomNavBar -->
<!-- iOS Home Indicator -->
<div class="absolute bottom-1 inset-x-0 flex justify-center pointer-events-none z-30">
<div class="w-32 h-1 bg-slate-300 rounded-full"></div>
</div>
</div>
<!-- END: MobileAppFrame -->














</body></html>
